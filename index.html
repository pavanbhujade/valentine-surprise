<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Poggu ❤️</title>

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
}

.container {
    text-align:center;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    width:90%;
    max-width:450px;
    animation: fadeIn 1.5s ease-in-out;
}

h1 {
    color:#ff3f6c;
}

button {
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.yes {
    background:#ff3f6c;
    color:white;
}

.no {
    background:#ccc;
}

button:hover {
    transform:scale(1.1);
}

.message {
    margin-top:20px;
    color:#444;
    font-size:18px;
    line-height:1.6;
    animation: fadeIn 1.5s ease-in-out;
}

img {
    width:200px;
    margin-top:15px;
    border-radius:15px;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(-20px);}
    to {opacity:1; transform:translateY(0);}
}

.heart {
    position:absolute;
    color:red;
    font-size:20px;
    animation: float 5s infinite;
}

@keyframes float {
    0% { transform:translateY(100vh); opacity:1;}
    100% { transform:translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<div class="container" id="mainBox">
    <h1>Happy Valentine's Day My Love ❤️</h1>
    <p>Do you love your Dudu? 😘</p>
    <button class="yes" onclick="showLove()">Yes ❤️</button>
    <button class="no" onmouseover="moveButton(this)">No 😜</button>
</div>

<script>

function showLove() {
    document.getElementById("mainBox").innerHTML = `
        <h1>Happy Valentine's Day Poggu ❤️</h1>

        <img src="https://i.imgur.com/1Q9Z1Zm.png" alt="Dudu Bubu Cute">

        <div class="message">
        I have not given you more surprises...<br>
        Not given expensive gift...<br><br>

        But I really care for you Poggu ❤️<br><br>

        I love you so much Pillu ❤️<br>
        I miss you so much Pillu ❤️<br><br>

        😘😘😘😘😘
        </div>
    `;
}

function moveButton(btn) {
    btn.style.position = "absolute";
    btn.style.top = Math.random()*80 + "%";
    btn.style.left = Math.random()*80 + "%";
}

// Floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (Math.random()*3+2) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}, 300);

</script>

</body>
</html>
