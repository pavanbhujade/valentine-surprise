<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Valentine Surprise ❤️</title>
<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
}

.container {
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 1.5s ease-in-out;
}

h1 {
    color:#ff4b6e;
}

button {
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.yes {
    background:#ff4b6e;
    color:white;
}

.no {
    background:#ccc;
}

button:hover {
    transform:scale(1.1);
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(-20px);}
    to {opacity:1; transform:translateY(0);}
}

.heart {
    position:absolute;
    color:red;
    font-size:20px;
    animation: float 5s infinite;
}

@keyframes float {
    0% { transform:translateY(100vh); opacity:1;}
    100% { transform:translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy Valentine's Day My Love ❤️</h1>
    <p>Do you know how much I love you?</p>
    <button class="yes" onclick="showLove()">Yes 💖</button>
    <button class="no" onmouseover="moveButton(this)">No 😜</button>
    <p id="message"></p>
</div>

<script>
function showLove() {
    document.getElementById("message").innerHTML =
    "I love you more than words can explain ❤️ <br><br> You are my happiness, my peace, and my forever. 💍✨";
}

function moveButton(btn) {
    btn.style.position = "absolute";
    btn.style.top = Math.random()*80 + "%";
    btn.style.left = Math.random()*80 + "%";
}

// Floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (Math.random()*3+2) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}, 300);
</script>

</body>
</html>
